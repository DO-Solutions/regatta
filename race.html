<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Poseidon's Regatta</title>
<style>
  :root {
    --bg:#0b1220; --panel:#111a2e; --edge:#22304d; --ink:#e8eefc; --dim:#8fa3c8;
    --think:#7c8db5; --accent:#0069ff; --good:#3fb950; --warn:#d29922;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI",system-ui,sans-serif; padding:18px 22px; }
  header { display:flex; align-items:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  header h1 { font-size:22px; font-weight:600; }
  header .sub { color:var(--dim); font-size:14px; }
  #controls { display:flex; gap:10px; flex:1 1 100%; margin-top:6px; }
  select, input[type=text] { flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--edge);
    border-radius:8px; padding:10px 12px; font-size:15px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 22px;
    font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:var(--panel); border:1px solid var(--edge); }
  #cols { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .col { background:var(--panel); border:1px solid var(--edge); border-radius:12px; display:flex;
    flex-direction:column; min-height:62vh; max-height:78vh; overflow:hidden; }
  .col h2 { font-size:18px; padding:12px 16px 4px; display:flex; justify-content:space-between; align-items:baseline; }
  .col h2 .price { color:var(--dim); font-size:12.5px; font-weight:400; }
  .think { color:var(--think); font:12.5px/1.45 ui-monospace,monospace; padding:8px 16px; max-height:150px;
    overflow-y:auto; border-top:1px dashed var(--edge); white-space:pre-wrap; }
  .think:empty { display:none; }
  .think::before { content:"thinking…"; display:block; color:var(--dim); font-style:italic; margin-bottom:2px; }
  .ans { padding:10px 16px 14px; overflow-y:auto; flex:1; white-space:pre-wrap; font-size:15px; }
  .stats { display:flex; gap:0; border-top:1px solid var(--edge); font-size:12.5px; color:var(--dim); }
  .stats div { flex:1; padding:8px 6px; text-align:center; }
  .stats b { display:block; color:var(--ink); font-size:15px; }
  .score { display:none; border-top:1px solid var(--edge); padding:10px 16px; }
  .score.on { display:flex; gap:18px; align-items:center; }
  .score .n { font-size:30px; font-weight:700; }
  .score .lbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .score .why { font-size:12.5px; color:var(--dim); flex:1; }
  .col.winner { border-color:var(--good); box-shadow:0 0 0 1px var(--good); }
  .err { color:#f85149; padding:8px 16px; font-size:13px; }
  #ctxnote { color:var(--dim); font-size:13px; margin:8px 2px; }
</style>
</head>
<body>
<header>
  <h1>Poseidon's Regatta</h1>
  <span class="sub">same question · same knowledge · three models race on DigitalOcean Serverless Inference</span>
  <div id="controls">
    <select id="qsel"><option>loading questions…</option></select>
    <input type="text" id="qfree" placeholder="…or type your own question">
    <button id="go">Ask all three</button>
    <button id="grade" class="ghost" disabled>Grade the answers</button>
  </div>
</header>
<div id="ctxnote"></div>
<div id="cols"></div>

<script>
const ARMS = [
  { id:"k26",  label:"Kimi K2.6",     price:"$0.76 / $3.20 per Mtok" },
  { id:"k3",   label:"Kimi K3",       price:"$3 / $15 per Mtok" },
  { id:"opus", label:"Claude Opus 5", price:"$5 / $25 per Mtok" },
];
let DATASET = [], answers = {}, doneCount = 0, currentQ = null, currentRef = null;

const cols = document.getElementById("cols");
for (const a of ARMS) {
  cols.insertAdjacentHTML("beforeend", `
    <div class="col" id="col-${a.id}">
      <h2>${a.label} <span class="price">${a.price}</span></h2>
      <div class="think" id="think-${a.id}"></div>
      <div class="ans" id="ans-${a.id}"></div>
      <div class="err" id="err-${a.id}"></div>
      <div class="score" id="score-${a.id}"></div>
      <div class="stats" id="stats-${a.id}"></div>
    </div>`);
}

fetch("/questions").then(r=>r.json()).then(rows=>{
  DATASET = rows;
  const sel = document.getElementById("qsel");
  sel.innerHTML = rows.map(r=>`<option value="${r.qid}">${r.query.replace(/</g,"&lt;")}</option>`).join("");
});

function resetPanes() {
  answers = {}; doneCount = 0;
  document.getElementById("grade").disabled = true;
  for (const a of ARMS) {
    for (const p of ["think","ans","err","stats"]) document.getElementById(`${p}-${a.id}`).textContent = "";
    const s = document.getElementById(`score-${a.id}`); s.className = "score"; s.innerHTML = "";
    document.getElementById(`col-${a.id}`).classList.remove("winner");
  }
}

function run() {
  resetPanes();
  const free = document.getElementById("qfree").value.trim();
  if (free) { currentQ = free; currentRef = null; }
  else {
    const row = DATASET[+document.getElementById("qsel").value];
    currentQ = row.query; currentRef = row.expected_response;
  }
  document.getElementById("ctxnote").textContent = "Q: " + currentQ;
  for (const a of ARMS) streamArm(a.id);
}

function streamArm(arm) {
  const es = new EventSource(`/stream?arm=${arm}&q=${encodeURIComponent(currentQ)}`);
  const think = document.getElementById(`think-${arm}`);
  const ans = document.getElementById(`ans-${arm}`);
  answers[arm] = "";
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === "think") { think.textContent += m.d; think.scrollTop = think.scrollHeight; }
    else if (m.t === "ans") { answers[arm] += m.d; ans.textContent = answers[arm]; ans.scrollTop = ans.scrollHeight; }
    else if (m.t === "err") { document.getElementById(`err-${arm}`).textContent = m.d; es.close(); armDone(); }
    else if (m.t === "done") {
      const s = m.stats;
      document.getElementById(`stats-${arm}`).innerHTML = `
        <div><b>${s.ttfa_s}s</b>first answer</div>
        <div><b>${s.total_s}s</b>total</div>
        <div><b>${s.completion_tokens}${s.tokens_estimated?"~":""}</b>out tokens</div>
        <div><b>${s.tok_per_s}</b>tok/s</div>
        <div><b>$${s.cost_usd.toFixed(4)}</b>cost</div>`;
      es.close(); armDone();
    }
  };
  es.onerror = () => { es.close(); armDone(); };
}

function armDone() {
  if (++doneCount >= ARMS.length)
    document.getElementById("grade").disabled = !currentRef;
}

async function grade() {
  const btn = document.getElementById("grade");
  btn.disabled = true; btn.textContent = "grading…";
  const r = await fetch("/judge", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ q: currentQ, ref: currentRef, answers }) });
  const scores = await r.json();
  let best = null;
  for (const a of ARMS) {
    const sc = scores[a.id] || {};
    const el = document.getElementById(`score-${a.id}`);
    el.className = "score on";
    el.innerHTML = `
      <div><span class="n">${sc.correctness ?? "–"}</span><span class="lbl">correct</span></div>
      <div><span class="n">${sc.faithfulness ?? "–"}</span><span class="lbl">faithful</span></div>
      <div class="why">${(sc.why||"").replace(/</g,"&lt;")}</div>`;
    const tot = (sc.correctness||0) + (sc.faithfulness||0);
    if (!best || tot > best.tot) best = { id:a.id, tot };
  }
  if (best) document.getElementById(`col-${best.id}`).classList.add("winner");
  btn.textContent = "Grade the answers";
}

document.getElementById("go").onclick = run;
document.getElementById("grade").onclick = grade;
</script>
</body>
</html>
